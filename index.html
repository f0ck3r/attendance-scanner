<!--
================================================================================
  AIRDRIE OVER 50 CLUB — ATTENDANCE SCANNER
  index.html
================================================================================

  WHAT THIS IS:
  A self-contained single-page web app for scanning member ID card barcodes
  at club activities. Staff tap "Begin Scanning ID Cards", members walk up and
  hold their card to the iPad camera, and attendance is logged automatically
  to a Google Sheet with name and timestamp.

  DEPLOYMENT:
  - Hosted on GitHub Pages via the 'main' branch root folder
  - Live URL: https://attendance.airdrieover50club.com
  - Domain is a CNAME from Wix DNS pointing to GitHub Pages
  - Two files required in repo root: index.html + sw.js
  - To deploy a new version: push both files to GitHub main branch.
    GitHub Pages publishes within ~30 seconds. The service worker then
    auto-updates the app on any open iPads on next launch.

  TECH STACK:
  - Pure HTML/CSS/JS — no build tools, no frameworks, no dependencies to install
  - QuaggaJS2 (@ericblade/quagga2 v1.8.4) — barcode decoder only (CDN)
  - Native browser getUserMedia API for camera (NOT Quagga's camera mgmt)
    IMPORTANT: We use getUserMedia directly because Quagga's built-in camera
    handling fails silently on iOS Safari. Do not switch back to Quagga.init()
    for camera management — it will break on iPad.
  - Web Audio API replaced by embedded MP3 (base64) for the scan beep
  - Service worker (sw.js) for caching + auto-updates
  - localStorage for offline queue and settings persistence

  BARCODE FORMAT:
  - Code 128 only
  - Member name is encoded directly in the barcode value
  - Scan result is used as-is for the member name in the Google Sheet

  SCAN RELIABILITY FEATURES:
  - Greyscale + contrast boost applied to each frame before decoding
  - Quagga2 checksum validation: error score must be < 0.25
  - 3-consecutive-frame vote confirmation before a scan is accepted
  - 2-second global cooldown after any accepted scan
  - 5-second per-card cooldown (same card can't scan twice within 5 seconds)

  OFFLINE QUEUE:
  - Failed posts (no network) are saved to localStorage key 'ao50_queue'
  - Queue is retried automatically when the 'online' event fires
  - Queue is also flushed on app launch if items are pending
  - Scan log shows amber queue icon for unsynced entries

  GOOGLE SHEETS INTEGRATION:
  - Uses Google Apps Script deployed as a web app (no OAuth required)
  - Posts via GET request with ?name=...&timestamp=... parameters
  - Apps Script URL is hardcoded (see HARDCODED SETTINGS below)
  - Timestamps are formatted in Mountain Time (America/Edmonton)
  - Google Apps Script code (in the linked Sheet):
      function doGet(e) {
        if (e.parameter.token !== 'ao50club2025') return ContentService.createTextOutput("Unauthorized");
        const sheet = SpreadsheetApp.getActiveSpreadsheet().getActiveSheet();
        sheet.appendRow([
          e.parameter.name,
          e.parameter.timestamp
        ]);
        return ContentService.createTextOutput("OK");
      }

  HARDCODED SETTINGS (change here in code, not in the app UI):
  - Apps Script URL: stored in cfg.url in the JS below — keep this out of
    public documentation. Obtain from the Google Apps Script deployment page.
  - Duplicate scan global cooldown: 2000ms (2 seconds)
  - Duplicate scan per-card cooldown: 5000ms (5 seconds) — stored in cfg.cooldown
  - Session auto-stop timeout: 30 minutes
  - Timezone: America/Edmonton (Mountain Time)
  - Vote threshold (consecutive matching frames required): 3
  - Checksum error threshold: 0.25

  ASSETS EMBEDDED AS BASE64:
  - Club logo (Club_Logo_Established_1968.png) — resized to 80px height,
    black background removed, embedded as data:image/png in the logo-mark div
  - Scanner beep sound (freesound_community-store-scanner-beep-90395.mp3)
    embedded as data:audio/mpeg in the BEEP_SRC constant

  AUTO-UPDATE BEHAVIOUR (service worker):
  - On launch: checks GitHub for a newer sw.js immediately
  - Every 60 seconds: rechecks while app is open
  - Update found + no active scan session: reloads silently and immediately
  - Update found + session is active: waits until session stops, then reloads
  - IMPORTANT: When deploying a new version, bump CACHE_VERSION in sw.js
    (e.g. 'ao50-v2.0' → 'ao50-v2.1') to trigger cache invalidation on all
    open devices. Version in index.html and sw.js must be kept in sync.

  iOS / SAFARI NOTES:
  - App is designed as an iPad home screen Web Clip (Add to Home Screen)
  - Apple Touch Icon is embedded as base64 in <head> (180x180px)
  - App title on home screen: "Over 50 Check-in"
  - Audio requires the AudioContext to be unlocked via a user gesture —
    handled by playing a silent buffer on the "Begin Scanning" button tap
  - Camera requires HTTPS (GitHub Pages provides this automatically)
  - playsinline attribute is set on <video> to prevent iOS fullscreen takeover

  VERSION HISTORY:
  v1.0 — Initial release. Native getUserMedia camera, QuaggaJS2 decode,
          blue theme, club logo, MP3 beep, green checkmark overlay,
          Google Sheets integration via Apps Script.
  v1.1 — Improved scan reliability: contrast boost, checksum validation,
          3-frame consecutive vote confirmation.
  v1.2 — Added service worker for offline caching and auto-updates.
          Added subtle "Check for updates" button in bottom bar.
  v1.3 — Added offline queue: failed scans saved to localStorage and
          retried automatically when connectivity returns.
  v1.4 — Removed manual "Check for updates" button. App now checks for
          updates automatically on launch and every 60 seconds.
  v1.5 — Security: added token to Apps Script requests. Removed full URL
          from comment block.
  v1.6 — Scan speed improvements: JPEG frame encoding (3x faster than PNG),
          centre-crop to 60% of frame, 8fps tick rate, vote threshold
          reduced from 3 to 2 frames.
  v1.7 — Added haptic feedback (80ms vibration) on successful scan.
  v1.8 — Name proper-case normalisation. Error logging to admin sheet
          (persistent via localStorage, survives reboots). Session
          start/stop logged. Global JS error catch.
  v1.9 — Production attendance URL. Column order flipped (timestamp → A,
          name → B). Persistent daily scan counter independent of log
          clears, survives reboots, resets at midnight.
  v2.0 — Camera feed zoomed in 20% by default for easier barcode framing.
  v2.1 — Low-light optimisation: brightness lift (+30), contrast factor
          increased (1.5 → 2.2), tick rate eased to 150ms for better
          camera sensor exposure time.

================================================================================

<meta name="apple-mobile-web-app-title" content="Over 50 Check-in">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --green: #1d4ed8; --green-light: #dbeafe; --green-dark: #1e40af;
    --red: #dc2626; --red-light: #fee2e2;
    --bg: #f8f9fa; --surface: #ffffff;
    --border: #e5e7eb; --border-strong: #d1d5db;
    --text: #111827; --text-muted: #6b7280; --text-faint: #9ca3af;
    --radius: 12px; --radius-sm: 8px;
  }
  html, body { height: 100%; background: var(--bg); font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; color: var(--text); -webkit-font-smoothing: antialiased; }
  .app { min-height: 100vh; display: flex; flex-direction: column; }
  header { background: var(--surface); border-bottom: 1px solid var(--border); padding: 14px 20px; display: flex; align-items: center; justify-content: space-between; position: sticky; top: 0; z-index: 10; }
  .logo { display: flex; align-items: center; gap: 10px; }
  .logo-mark { height: 52px; display: flex; align-items: center; flex-shrink: 0; }
  .logo-mark svg { width: 20px; height: 20px; fill: white; }
  .logo-text { line-height: 1.2; }
  .logo-text strong { font-size: 15px; font-weight: 600; display: block; }
  .logo-text span { font-size: 12px; color: var(--text-muted); }
  .header-right { display: flex; align-items: center; gap: 8px; }
  .count-pill { background: var(--green-light); color: var(--green); font-size: 12px; font-weight: 600; padding: 4px 10px; border-radius: 999px; white-space: nowrap; }
  .icon-btn { width: 36px; height: 36px; border: 1px solid var(--border); border-radius: var(--radius-sm); background: var(--surface); cursor: pointer; display: flex; align-items: center; justify-content: center; color: var(--text-muted); -webkit-tap-highlight-color: transparent; }
  .icon-btn:active { background: var(--bg); }
  .icon-btn svg { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  main { flex: 1; display: grid; grid-template-columns: 1fr 1fr; gap: 16px; padding: 16px; max-width: 1100px; width: 100%; margin: 0 auto; align-items: start; }
  @media (max-width: 700px) { main { grid-template-columns: 1fr; } }
  .card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); overflow: hidden; }
  .card-header { padding: 12px 16px; border-bottom: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; }
  .card-label { font-size: 11px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: var(--text-muted); display: flex; align-items: center; gap: 6px; }
  .card-label svg { width: 14px; height: 14px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  .camera-wrap { position: relative; background: #0a0a0a; aspect-ratio: 4/3; overflow: hidden; }
  #video { width: 100%; height: 100%; object-fit: cover; display: none; transform: scale(1.2); transform-origin: center center; }
  .camera-idle-state { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px; color: #555; background: #0a0a0a; }
  .camera-idle-state svg { width: 40px; height: 40px; fill: none; stroke: #555; stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; opacity: 0.5; }
  .camera-idle-state p { font-size: 13px; opacity: 0.6; }
  .scan-overlay { position: absolute; inset: 0; pointer-events: none; display: none; }
  .scan-corner { position: absolute; width: 28px; height: 28px; border-color: #60a5fa; border-style: solid; opacity: 0.9; }
  .scan-corner.tl { top: 18%; left: 8%; border-width: 3px 0 0 3px; border-radius: 4px 0 0 0; }
  .scan-corner.tr { top: 18%; right: 8%; border-width: 3px 3px 0 0; border-radius: 0 4px 0 0; }
  .scan-corner.bl { bottom: 18%; left: 8%; border-width: 0 0 3px 3px; border-radius: 0 0 0 4px; }
  .scan-corner.br { bottom: 18%; right: 8%; border-width: 0 3px 3px 0; border-radius: 0 0 4px 0; }
  .scan-beam { position: absolute; left: 8%; right: 8%; height: 2px; background: linear-gradient(90deg, transparent, #60a5fa, transparent); top: 18%; animation: beam 2s ease-in-out infinite; box-shadow: 0 0 8px #60a5fa; }
  @keyframes beam { 0%,100%{top:20%;} 50%{top:78%;} }
  .scan-flash { position: absolute; inset: 0; background: rgba(29,78,216,0.25); opacity: 0; pointer-events: none; transition: opacity 0.08s; }
  .scan-flash.active { opacity: 1; }
  .scan-success { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; pointer-events: none; opacity: 0; transition: opacity 0.15s; }
  .scan-success.active { opacity: 1; }
  .scan-success-circle { width: 90px; height: 90px; border-radius: 50%; background: rgba(29,78,216,0.92); display: flex; align-items: center; justify-content: center; transform: scale(0.7); transition: transform 0.2s cubic-bezier(0.175,0.885,0.32,1.275); }
  .scan-success.active .scan-success-circle { transform: scale(1); }
  .scan-success-circle svg { width: 48px; height: 48px; fill: none; stroke: white; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; }
  .camera-footer { padding: 12px 16px; display: flex; gap: 8px; align-items: center; }
  .btn-primary { flex: 1; padding: 11px 16px; background: var(--green); color: white; border: none; border-radius: var(--radius-sm); font-size: 14px; font-weight: 600; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 7px; -webkit-tap-highlight-color: transparent; transition: background 0.15s; }
  .btn-primary:active { background: var(--green-dark); }
  .btn-primary svg { width: 16px; height: 16px; fill: none; stroke: white; stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round; }
  .btn-secondary { padding: 11px 14px; background: var(--surface); color: var(--text); border: 1px solid var(--border-strong); border-radius: var(--radius-sm); font-size: 14px; font-weight: 500; cursor: pointer; display: flex; align-items: center; gap: 6px; -webkit-tap-highlight-color: transparent; }
  .btn-secondary:active { background: var(--bg); }
  .btn-secondary svg { width: 16px; height: 16px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  .timer-display { font-size: 13px; font-weight: 600; font-variant-numeric: tabular-nums; color: var(--text-muted); min-width: 44px; text-align: center; padding: 8px 10px; border: 1px solid var(--border); border-radius: var(--radius-sm); background: var(--bg); }
  .timer-display.live { color: var(--green); border-color: #93c5fd; background: var(--green-light); }
  .status-strip { padding: 7px 16px; font-size: 12px; border-top: 1px solid var(--border); min-height: 30px; color: var(--text-faint); }
  .status-strip.ok { color: var(--green); background: #eff6ff; }
  .status-strip.err { color: var(--red); background: var(--red-light); }
  .log-scroll { max-height: 420px; overflow-y: auto; -webkit-overflow-scrolling: touch; }
  .log-empty { padding: 40px 20px; text-align: center; color: var(--text-faint); font-size: 13px; }
  .log-empty svg { width: 32px; height: 32px; fill: none; stroke: currentColor; stroke-width: 1.5; opacity: 0.4; display: block; margin: 0 auto 10px; }
  .log-item { display: flex; align-items: center; gap: 12px; padding: 11px 16px; border-bottom: 1px solid var(--border); animation: slideIn 0.25s ease; }
  .log-item:last-child { border-bottom: none; }
  @keyframes slideIn { from { opacity:0; transform:translateY(-8px); } to { opacity:1; transform:translateY(0); } }
  .avatar { width: 34px; height: 34px; border-radius: 50%; background: #eff6ff; color: #2563eb; font-size: 11px; font-weight: 700; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
  .log-meta { flex: 1; min-width: 0; }
  .log-name { font-size: 14px; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .log-time { font-size: 11px; color: var(--text-muted); margin-top: 1px; }
  .status-icon { flex-shrink: 0; width: 22px; height: 22px; }
  .status-icon svg { width: 22px; height: 22px; }
  .modal-backdrop { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.45); z-index: 100; align-items: flex-end; justify-content: center; }
  .modal-backdrop.open { display: flex; }
  .modal { background: var(--surface); border-radius: var(--radius) var(--radius) 0 0; padding: 20px; width: 100%; max-width: 560px; max-height: 85vh; overflow-y: auto; -webkit-overflow-scrolling: touch; }
  .modal-handle { width: 40px; height: 4px; background: var(--border-strong); border-radius: 2px; margin: 0 auto 18px; }
  .modal-title { font-size: 17px; font-weight: 600; margin-bottom: 18px; }
  .field { margin-bottom: 14px; }
  .field label { display: block; font-size: 12px; font-weight: 600; color: var(--text-muted); margin-bottom: 5px; letter-spacing: 0.04em; text-transform: uppercase; }
  .field input, .field select { width: 100%; padding: 10px 12px; font-size: 15px; border: 1px solid var(--border-strong); border-radius: var(--radius-sm); background: var(--surface); color: var(--text); -webkit-appearance: none; appearance: none; }
  .field input:focus, .field select:focus { outline: none; border-color: var(--green); }
  .field .hint { font-size: 11px; color: var(--text-faint); margin-top: 4px; line-height: 1.5; }
  .modal-actions { display: flex; gap: 8px; margin-top: 20px; }
  .btn-save { flex: 1; padding: 13px; background: var(--green); color: white; border: none; border-radius: var(--radius-sm); font-size: 15px; font-weight: 600; cursor: pointer; }
  .btn-cancel { padding: 13px 18px; background: var(--bg); color: var(--text-muted); border: 1px solid var(--border); border-radius: var(--radius-sm); font-size: 15px; cursor: pointer; }
  .clear-btn { display: flex; align-items: center; gap: 5px; padding: 5px 10px; font-size: 12px; color: var(--text-muted); background: none; border: 1px solid var(--border); border-radius: var(--radius-sm); cursor: pointer; -webkit-tap-highlight-color: transparent; }
  .clear-btn:active { background: var(--bg); }
  .clear-btn svg { width: 13px; height: 13px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; flex-shrink: 0; }
  .toast { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%) translateY(80px); background: #1f2937; color: white; padding: 10px 18px; border-radius: 999px; font-size: 13px; font-weight: 500; transition: transform 0.3s ease; z-index: 200; white-space: nowrap; pointer-events: none; }
  .toast.show { transform: translateX(-50%) translateY(0); }
  @keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
  .bottom-bar { display: flex; align-items: center; justify-content: space-between; padding: 10px 20px 16px; max-width: 1100px; margin: 0 auto; }
  .version-tag { font-size: 11px; color: var(--text-faint); letter-spacing: 0.05em; }
  .queue-badge { font-size: 11px; color: #d97706; background: #fef3c7; border: 1px solid #fde68a; border-radius: 999px; padding: 3px 8px; }
  .status-strip.warn { color: #d97706; background: #fffbeb; }
</style>

<script>
let sessionActive = false;
let sessionTimeout = null;
let stream = null;
let scanLog = [];
let lastScanned = {};
let lastScanTime = 0;
let voteBuffer = [];        // consecutive matching reads required before accepting
const VOTE_THRESHOLD = 2;   // 2 consecutive matching frames required (checksum handles accuracy)

// ── Persistent daily scan counter ──
// Stored independently of the scan log so clearing the log doesn't reset it.
// Survives app close, Safari force-quit, and reboots via localStorage.
function getTodayKey() {
  return 'ao50_daily_' + new Date().toISOString().slice(0, 10); // e.g. ao50_daily_2025-01-14
}
function getDailyCount() {
  try { return parseInt(localStorage.getItem(getTodayKey()) || '0'); } catch(e) { return 0; }
}
function incrementDailyCount() {
  try {
    const key = getTodayKey();
    const count = getDailyCount() + 1;
    localStorage.setItem(key, count);
    // Clean up previous days (keep only last 7)
    Object.keys(localStorage)
      .filter(k => k.startsWith('ao50_daily_') && k !== key)
      .sort().slice(0, -6) // keep last 6 old days, remove anything older
      .forEach(k => localStorage.removeItem(k));
    return count;
  } catch(e) { return getDailyCount(); }
}
function updateDailyCountBadge() {
  const count = getDailyCount();
  const pill = document.getElementById('count-pill');
  if (pill) pill.textContent = count + (count === 1 ? ' today' : ' today');
}
// cfg.errorUrl = current sheet (admin/error log)
// cfg.attendanceUrl = production attendance sheet (set in v2.0)
let cfg = {
  errorUrl: 'https://script.google.com/macros/s/AKfycbxmLd-fgKOZ9Iub2efrOO4ELUlLkTVI5g1nfCG219qwwr9kwQ4FCEimPdLXWCs3CYAbug/exec',
  attendanceUrl: 'https://script.google.com/macros/s/AKfycbxIWPOiEVVqUxrRL54aK3XjkP66Bh9Ikl4RxoAtSDwLaBdhdztLX8_BadrThOryLCI-qQ/exec',
  cooldown: 5000
};

function loadCfg() {
  try { const s = localStorage.getItem('ao50_cfg'); if (s) cfg = {...cfg, ...JSON.parse(s)}; } catch(e) {}
}
function saveCfg() {
  try { localStorage.setItem('ao50_cfg', JSON.stringify(cfg)); } catch(e) {}
}
function openSettings() {
  document.getElementById('cfg-url').value = cfg.url || '';
  document.getElementById('cfg-cooldown').value = cfg.cooldown || 5000;
  document.getElementById('modal').classList.add('open');
}
function closeSettings() { document.getElementById('modal').classList.remove('open'); }
function handleBackdropClick(e) { if (e.target === document.getElementById('modal')) closeSettings(); }
function saveSettings() {
  cfg.cooldown = parseInt(document.getElementById('cfg-cooldown').value);
  saveCfg(); closeSettings(); showToast('Settings saved');
}
function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2500);
}
function setStatus(msg, type) {
  const el = document.getElementById('status');
  el.textContent = msg;
  el.className = 'status-strip' + (type ? ' ' + type : '');

let beepAudio = null;
function unlockAudio() {
  try {
    if (!beepAudio) { beepAudio = new Audio(BEEP_SRC); beepAudio.volume = 1.0; }
    const p = beepAudio.play();
    if (p) p.then(() => { beepAudio.pause(); beepAudio.currentTime = 0; }).catch(() => {});
  } catch(e) {}
}
function beep() {
  if (!beepAudio) return;
  try { beepAudio.currentTime = 0; beepAudio.play().catch(() => {}); } catch(e) {}
}

// Session — uses native getUserMedia directly (works on iOS Safari)
function startSession() {
  lastScanned = {};
  lastScanTime = 0;
  unlockAudio();

  navigator.mediaDevices.getUserMedia({
    video: { facingMode: { ideal: 'environment' }, width: { ideal: 1280 }, height: { ideal: 720 } },
    audio: false
  }).then(function(mediaStream) {
    stream = mediaStream;
    const video = document.getElementById('video');
    video.srcObject = stream;
    video.style.display = 'block';
    video.play().then(() => {
      sessionActive = true;
      document.getElementById('idle-state').style.display = 'none';
      document.getElementById('scan-overlay').style.display = 'block';
      document.getElementById('btn-start').style.display = 'none';
      document.getElementById('btn-stop').style.display = 'flex';
      sessionTimeout = setTimeout(stopSession, 30 * 60 * 1000);
      setStatus('Scanning — hold member card steady in view', 'ok');
    logError('INFO', 'Session started');
      scanFrames();
    });
  }).catch(function(err) {
    const errMsg = 'Camera error: ' + (err.message || err);
    setStatus(errMsg, 'err');
    logError('ERROR', errMsg);
  });
}

function stopSession() {
  if (!sessionActive) return;
  sessionActive = false;
  voteBuffer = [];
  if (sessionTimeout) { clearTimeout(sessionTimeout); sessionTimeout = null; }
  if (stream) { stream.getTracks().forEach(t => t.stop()); stream = null; }
  const video = document.getElementById('video');
  video.srcObject = null;
  video.style.display = 'none';
  document.getElementById('idle-state').style.display = 'flex';
  document.getElementById('scan-overlay').style.display = 'none';
  document.getElementById('btn-start').style.display = 'flex';
  document.getElementById('btn-stop').style.display = 'none';
  const scanCount = scanLog.filter(e => e.time && new Date(e.time).toDateString() === new Date().toDateString()).length;
  logError('INFO', 'Session ended — ' + scanCount + ' scan' + (scanCount !== 1 ? 's' : '') + ' this session');
  setStatus('Session ended', '');
  if (updatePending) window.location.reload();
}

// Frame scanning — getUserMedia feeds video, Quagga2 decodes frames
// Uses a confidence voting system: same value must appear 2 times in a row
// before being accepted. Checksum validation handles accuracy; voting handles
// the remaining edge cases. 2 votes keeps confirmation fast (~250ms).

function scanFrames() {
  const video = document.getElementById('video');
  const canvas = document.getElementById('canvas');
  const ctx = canvas.getContext('2d', { willReadFrequently: true });

  function tick() {
    if (!sessionActive) return;
    if (video.readyState >= 2 && video.videoWidth > 0) {
      const vw = video.videoWidth;
      const vh = video.videoHeight;

      // Crop to the centre 60% of the frame vertically — this is where
      // someone naturally holds a card. Less pixels = faster encode + decode.
      const cropTop = Math.floor(vh * 0.2);
      const cropHeight = Math.floor(vh * 0.6);

      canvas.width = vw;
      canvas.height = cropHeight;
      ctx.drawImage(video, 0, cropTop, vw, cropHeight, 0, 0, vw, cropHeight);

      // Greyscale + contrast boost on the cropped region only
      const imageData = ctx.getImageData(0, 0, vw, cropHeight);
      const d = imageData.data;
      for (let i = 0; i < d.length; i += 4) {
        const grey = 0.299 * d[i] + 0.587 * d[i+1] + 0.114 * d[i+2];
        // Brightness lift (+30) helps in low-light before contrast stretch
        // Contrast factor 2.2 (up from 1.5) makes dark bars pop against dim backgrounds
        const lifted = Math.min(255, grey + 30);
        const contrasted = Math.min(255, Math.max(0, (lifted - 128) * 2.2 + 128));
        d[i] = d[i+1] = d[i+2] = contrasted;
      }
      ctx.putImageData(imageData, 0, 0);

      try {
        Quagga.decodeSingle({
          decoder: {
            readers: ['code_128_reader'],
            debug: { drawBoundingBox: false, showFrequency: false, drawScanline: false }
          },
          locate: true,
          inputStream: { size: 800 },
          // JPEG at 0.85 quality is ~3x faster to encode than PNG,
          // with no meaningful quality loss for barcode detection
          src: canvas.toDataURL('image/jpeg', 0.85)
        }, function(result) {
          const code = result && result.codeResult && result.codeResult.code;
          const validChecksum = result && result.codeResult &&
            result.codeResult.startInfo &&
            result.codeResult.decodedCodes &&
            result.codeResult.decodedCodes.length > 0 &&
            result.codeResult.decodedCodes.slice(-1)[0].error < 0.25;
          if (code && validChecksum) {
            voteBuffer.push(code);
            if (voteBuffer.length > VOTE_THRESHOLD) voteBuffer.shift();
            if (voteBuffer.length === VOTE_THRESHOLD && voteBuffer.every(v => v === code)) {
              voteBuffer = [];
              handleScan(code);
            }
          } else {
            voteBuffer = [];
          }
        });
      } catch(e) {}
    }
    if (sessionActive) setTimeout(tick, 150); // ~6.5fps — slightly slower for better low-light exposure
  }
  tick();
}

function handleScan(value) {
  const now = Date.now();
  if (now - lastScanTime < 2000) return;
  if (lastScanned[value] && (now - lastScanned[value]) < cfg.cooldown) return;
  lastScanTime = now;
  lastScanned[value] = now;
  incrementDailyCount();
  updateDailyCountBadge();
  beep();
  // Haptic feedback — works on iOS Safari and Android Chrome
  if (navigator.vibrate) navigator.vibrate(80);
  const flash = document.getElementById('flash');
  flash.classList.add('active');
  setTimeout(() => flash.classList.remove('active'), 150);
  const success = document.getElementById('scan-success');
  success.classList.add('active');
  setTimeout(() => success.classList.remove('active'), 900);
  const entry = { id: now, name: value, time: new Date(), status: 'pending' };
  scanLog.unshift(entry);
  renderLog();
  postToSheet(entry);
}

// ── Offline queue ──
// Failed posts are saved to localStorage and retried automatically when
// connectivity returns. Staff don't need to do anything.

function loadQueue() {
  try { return JSON.parse(localStorage.getItem('ao50_queue') || '[]'); } catch(e) { return []; }
}
function saveQueue(q) {
  try { localStorage.setItem('ao50_queue', JSON.stringify(q)); } catch(e) {}
}
function addToQueue(entry) {
  const q = loadQueue();
  // Avoid duplicates in case of rapid retries
  if (!q.find(e => e.id === entry.id)) {
    q.push({ id: entry.id, name: entry.name, time: entry.time });
    saveQueue(q);
  }
  updateQueueBadge();
}
function removeFromQueue(id) {
  const q = loadQueue().filter(e => e.id !== id);
  saveQueue(q);
  updateQueueBadge();
}

function updateQueueBadge() {
  const q = loadQueue();
  const badge = document.getElementById('queue-badge');
  if (!badge) return;
  if (q.length > 0) {
    badge.textContent = q.length + ' pending';
    badge.style.display = 'inline';
  } else {
    badge.style.display = 'none';
  }
}

// Normalise name to proper case regardless of how barcode was encoded
// e.g. JOHN SMITH → John Smith, john smith → John Smith
function toProperCase(str) {
  return str.trim().toLowerCase().replace(/\b\w/g, c => c.toUpperCase());
}

async function postEntry(id, name, time) {
  const properName = toProperCase(name);
  const params = new URLSearchParams({
    timestamp: new Date(time).toLocaleString('en-CA', { timeZone: 'America/Edmonton' }),
    name: properName,
    token: 'ao50club2025'
  });
  const url = cfg.attendanceUrl || cfg.errorUrl; // fallback to error URL if attendance not set yet
  await fetch(url + '?' + params.toString(), { method: 'GET', mode: 'no-cors' });
}

async function postToSheet(entry) {
  try {
    await postEntry(entry.id, entry.name, entry.time);
    updateEntryStatus(entry.id, 'done');
    setStatus('Recorded: ' + entry.name, 'ok');
  } catch(e) {
    // Network failed — queue it for later
    updateEntryStatus(entry.id, 'queued');
    addToQueue(entry);
    setStatus('Offline — scan saved, will sync when connected', 'warn');
    logError('WARN', 'Attendance post failed for ' + entry.name + ' — queued for retry');
  }
}

// Retry all queued entries
async function flushQueue() {
  const q = loadQueue();
  if (q.length === 0) return;
  let successCount = 0;
  for (const item of q) {
    try {
      await postEntry(item.id, item.name, item.time);
      removeFromQueue(item.id);
      // Update the log entry status if it's still visible
      updateEntryStatus(item.id, 'done');
      successCount++;
    } catch(e) {
      break; // Still offline — stop trying, wait for next online event
    }
  }
  if (successCount > 0) {
    updateQueueBadge();
    showToast(successCount + ' queued scan' + (successCount > 1 ? 's' : '') + ' synced ✓');
    setStatus('Synced ' + successCount + ' offline scan' + (successCount > 1 ? 's' : ''), 'ok');
  }
}

// ── Error logging ──
// Errors are queued locally (survives reboots) and posted to the admin sheet
// when connectivity is available. Staff never see this — it's for admin debugging.

const ERROR_LOG_KEY = 'ao50_errlog';

function loadErrorQueue() {
  try { return JSON.parse(localStorage.getItem(ERROR_LOG_KEY) || '[]'); } catch(e) { return []; }
}
function saveErrorQueue(q) {
  try {
    // Keep last 50 errors max to avoid filling localStorage
    localStorage.setItem(ERROR_LOG_KEY, JSON.stringify(q.slice(-50)));
  } catch(e) {}
}

function logError(type, message) {
  const entry = {
    id: Date.now(),
    timestamp: new Date().toLocaleString('en-CA', { timeZone: 'America/Edmonton' }),
    type: type,
    message: message
  };
  const q = loadErrorQueue();
  q.push(entry);
  saveErrorQueue(q);
  // Try to post immediately; if offline it stays in queue for later
  postErrorEntry(entry);
}

async function postErrorEntry(entry) {
  if (!cfg.errorUrl) return;
  try {
    const params = new URLSearchParams({
      timestamp: entry.timestamp,
      type: entry.type,
      message: entry.message,
      device: 'iPad',
      token: 'ao50club2025'
    });
    await fetch(cfg.errorUrl + '?' + params.toString(), { method: 'GET', mode: 'no-cors' });
    // Remove from queue on success
    const q = loadErrorQueue().filter(e => e.id !== entry.id);
    saveErrorQueue(q);
  } catch(e) {
    // Leave in queue — will retry when online
  }
}

async function flushErrorQueue() {
  const q = loadErrorQueue();
  if (q.length === 0) return;
  for (const entry of q) {
    try {
      await postErrorEntry(entry);
    } catch(e) {
      break; // Still offline
    }
  }
}

// Listen for connectivity changes
window.addEventListener('online', () => {
  showToast('Back online — syncing...');
  setTimeout(() => { flushQueue(); flushErrorQueue(); }, 1000);
});
window.addEventListener('offline', () => {
  setStatus('Offline — scans will be saved and synced automatically', 'warn');
});

// On startup, flush any queue left over from a previous session
window.addEventListener('load', () => {
  updateQueueBadge();
  if (navigator.onLine && loadQueue().length > 0) {
    setTimeout(() => {
      flushQueue();
    }, 2000);
  }
});

function initials(name) {
  return name.trim().split(/\s+/).map(w => w[0] || '').join('').substring(0,2).toUpperCase() || '?';
}
function escHtml(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
function renderLog() {
  const list = document.getElementById('log-list');
  if (!scanLog.length) {
    list.innerHTML = '<div class="log-empty"><svg viewBox="0 0 24 24"><rect x="2" y="5" width="2" height="14"/><rect x="6" y="5" width="1" height="14"/><rect x="9" y="5" width="2" height="14"/><rect x="13" y="5" width="1" height="14"/><rect x="16" y="5" width="2" height="14"/></svg>No scans yet</div>';
    return;
  }
  list.innerHTML = scanLog.map(e => {
    const t = e.time.toLocaleTimeString([], {hour:'2-digit',minute:'2-digit',second:'2-digit'});
    const icon = e.status === 'done'
      ? '<svg viewBox="0 0 24 24" style="stroke:#16a34a;fill:none;stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></svg>'
      : e.status === 'queued'
        ? '<svg viewBox="0 0 24 24" style="stroke:#d97706;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round"><path d="M1 6l4 4 4-4"/><path d="M5 10V3"/><rect x="11" y="3" width="10" height="3" rx="1"/><rect x="11" y="9" width="7" height="3" rx="1"/><rect x="11" y="15" width="8" height="3" rx="1"/></svg>'
      : e.status === 'error'
        ? '<svg viewBox="0 0 24 24" style="stroke:#dc2626;fill:none;stroke-width:2;stroke-linecap:round"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>'
        : '<svg viewBox="0 0 24 24" style="stroke:#d97706;fill:none;stroke-width:2;stroke-linecap:round"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>';
    return '<div class="log-item"><div class="avatar">' + initials(e.name) + '</div><div class="log-meta"><div class="log-name">' + escHtml(e.name) + '</div><div class="log-time">' + t + '</div></div><div class="status-icon">' + icon + '</div></div>';
  }).join('');
  // Count pill is driven by persistent daily counter, not scan log
  updateDailyCountBadge();
}
function updateEntryStatus(id, status) {
  const e = scanLog.find(e => e.id === id);
  if (e) { e.status = status; renderLog(); }
}
function clearLog() {
  if (scanLog.length && !confirm('Clear the scan log?')) return;
  scanLog = []; renderLog();
}

loadCfg();
renderLog();
updateDailyCountBadge(); // restore daily count from localStorage on launch

// Global JS error catch — logs unexpected errors to admin sheet
window.addEventListener('error', function(e) {
  logError('ERROR', 'JS error: ' + e.message + ' (' + (e.filename || '') + ':' + (e.lineno || '') + ')');
});
window.addEventListener('unhandledrejection', function(e) {
  logError('ERROR', 'Unhandled promise: ' + (e.reason && e.reason.message ? e.reason.message : String(e.reason)));
});

// Flush any error queue left from previous session
if (navigator.onLine) setTimeout(flushErrorQueue, 3000);

// ── Service Worker registration & auto-update ──
const APP_VERSION = '1.4';
let updatePending = false;

if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('/sw.js').then(reg => {
    // Check for an update immediately on load, and every 60 seconds after
    reg.update();
    setInterval(() => reg.update(), 60000);

    reg.addEventListener('updatefound', () => {
      const newWorker = reg.installing;
      newWorker.addEventListener('statechange', () => {
        if (newWorker.state === 'installed' && navigator.serviceWorker.controller) {
          // New version is ready — reload if safe, otherwise wait
          applyUpdate();
        }
      });
    });
  }).catch(() => {});

  // SW signals a new version is active after activation
  navigator.serviceWorker.addEventListener('message', e => {
    if (e.data && e.data.type === 'NEW_VERSION') applyUpdate();
  });

  // When SW controller changes (i.e. new SW took over), reload to use new files
  navigator.serviceWorker.addEventListener('controllerchange', () => {
    if (!sessionActive) window.location.reload();
  });
}

function applyUpdate() {
  if (sessionActive) {
    // Don't interrupt an active session — flag it and reload when they stop
    updatePending = true;
  } else {
    window.location.reload();
  }
}
</script>
